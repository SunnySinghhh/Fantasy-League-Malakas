<style>
  .lede { color: var(--text-dim); font-size: 13.5px; max-width: 68ch; margin: -4px 0 0; }

  /* ---- chart legend ---- */
  .chart-legend-row { display: flex; flex-direction: column; gap: 10px; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px 5px 8px;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.15s ease, border-color 0.15s ease;
  }
  .legend-item:hover { border-color: var(--accent); }
  .legend-item.hidden { opacity: 0.4; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-actions {
    display: flex;
    gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .legend-actions button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    padding: 0;
  }
  .legend-actions button:hover { text-decoration: underline; }

  /* ---- line chart ---- */
  .chart-wrap { width: 100%; overflow-x: auto; }
  .line-chart-svg { width: 100%; min-width: 480px; height: auto; display: block; }
  .chart-gridline { stroke: var(--border); stroke-width: 1; }
  .chart-axis-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; fill: var(--text-faint); }
  .chart-line { transition: opacity 0.15s ease; }
  .chart-dot { transition: opacity 0.15s ease; }

  /* ---- win/loss bars ---- */
  .wl-list { display: flex; flex-direction: column; gap: 10px; }
  .wl-row { display: grid; grid-template-columns: minmax(140px, 200px) 1fr auto; align-items: center; gap: 12px; }
  .wl-bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
  .wl-seg.wl-win { background: var(--win); }
  .wl-seg.wl-loss { background: var(--loss); }
  .wl-seg.wl-tie { background: var(--text-faint); }
  .wl-record { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); white-space: nowrap; }

  /* ---- head to head ---- */
  .h2h-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .h2h-controls label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  select.h2h-select { min-width: 220px; font-size: 14.5px; }

  .rename-note { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--text-faint); }
  .renamed-mark { color: var(--accent); font-size: 0.85em; cursor: help; }

  .h2h-summary { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--text-dim); }
  .h2h-summary strong { color: var(--accent); font-size: 15px; }
</style>

<script src="assets/theme.js"></script>
<script>
(function () {
  "use strict";

  var PALETTE = ["#dba84a", "#e8544a", "#5fb3d9", "#9b7fd4", "#5fbf85", "#ff8fb1", "#6bc9c0", "#d9a441", "#8f9bd4", "#e0824a", "#4d6dc9", "#c96bd4"];

  // ---------------------------------------------------------------------
  // Owner identity — several ESPN team slots have changed hands over the
  // years (a different real person took over the same roster slot), and a
  // couple of owners have even switched slots season to season. Stats need
  // to follow the PERSON, not the slot, so this table (confirmed with the
  // commissioner, not inferred from name changes) maps every historical
  // (teamId, season) to the owner who actually ran it that year. Any
  // (teamId, season) not listed here falls back to "one continuous owner
  // for that slot," which covers every team that's never changed hands.
  //
  // activeTeamId: set if this owner currently holds a slot (their name/logo
  // comes from live standings); omit/null if they've since left the league
  // (their name/logo comes from `name` below instead).
  var OWNER_OVERRIDES = [
    { id: "sunny", name: "Sunny's Sp*rm Bank", activeTeamId: 1,
      grants: [{ teamId: 1, seasons: [2022, 2023, 2024, 2025] }] },
    { id: "jpops-owner", name: "JPOPS", activeTeamId: 2,
      grants: [{ teamId: 2, seasons: [2022, 2023, 2024, 2025] }] },
    { id: "manpreet", name: "Manpreet", activeTeamId: null,
      grants: [{ teamId: 5, seasons: [2022] }] },
    { id: "kosta", name: "Kostas", activeTeamId: null,
      // Kosta ran team 12's slot in 2022, then moved to team 5's slot in 2023.
      grants: [{ teamId: 12, seasons: [2022] }, { teamId: 5, seasons: [2023] }] },
    { id: "evan", name: "Ecuador roof repair", activeTeamId: 5,
      grants: [{ teamId: 5, seasons: [2024, 2025] }] },
    { id: "chris", name: "Houston Hicks", activeTeamId: 6,
      // Chris owned this slot in 2022, Alex took it over for two years, then Chris returned in 2025.
      grants: [{ teamId: 6, seasons: [2022, 2025] }] },
    { id: "alex", name: "CP Central", activeTeamId: null,
      grants: [{ teamId: 6, seasons: [2023, 2024] }] },
    { id: "pandelidis-owner", name: "Pandelidis FC", activeTeamId: 8,
      grants: [{ teamId: 8, seasons: [2022, 2023, 2024, 2025] }] },
    { id: "chase-brown-kids-owner", name: "Chase Brown Kids", activeTeamId: 11,
      grants: [{ teamId: 11, seasons: [2022, 2023, 2024, 2025] }] },
    { id: "nick", name: "Purple P()ssy Eaters", activeTeamId: null,
      grants: [{ teamId: 12, seasons: [2023, 2024] }] },
    { id: "dimitri", name: "DeeGotti's Welfare Warriors", activeTeamId: 12,
      grants: [{ teamId: 12, seasons: [2025] }] }
  ];

  function buildOwnerIndex() {
    var map = new Map(); // "teamId:season" -> ownerId
    OWNER_OVERRIDES.forEach(function (o) {
      o.grants.forEach(function (g) {
        g.seasons.forEach(function (season) {
          map.set(g.teamId + ":" + season, o.id);
        });
      });
    });
    return map;
  }

  // Any (teamId, season) not covered by an override is one continuous
  // owner for that slot — the common case.
  function ownerIdFor(ownerIndex, teamId, season) {
    var key = teamId + ":" + season;
    return ownerIndex.has(key) ? ownerIndex.get(key) : "team-" + teamId;
  }

  var hiddenPF = new Set();
  var hiddenPA = new Set();
  var STATE = null; // { registry, teamIds (really ownerIds), matchups, ownerIndex }

  function fmt1(n) { return typeof n === "number" ? n.toFixed(1) : "—"; }

  // Baseball-style ".679" win-pct formatting — handled as a special case at
  // the top end so a perfect record renders "1.000", not a truncated ".100"
  // (Math.round(1000) has 4 digits, which a plain 3-char slice mangles).
  function fmtPct(pct) {
    if (pct == null) return "—";
    if (pct >= 0.9995) return "1.000";
    return "." + String(Math.round(pct * 1000)).padStart(3, "0");
  }

  function fallbackLogoHtml(name) {
    return '<span class="fallback-logo">' + (name ? name.charAt(0) : "?") + '</span>';
  }

  function teamLogoHtml(team) {
    return team.logo
      ? '<img src="' + team.logo + '" alt="" loading="lazy">'
      : fallbackLogoHtml(team.name);
  }

  // ---------------------------------------------------------------------
  // Data shaping
  // ---------------------------------------------------------------------

  // Registry is keyed by ownerId (a person), not raw teamId. For an owner
  // still in the league, name/logo come from live standings for the slot
  // they currently hold; for a departed owner, from the reference name set
  // in OWNER_OVERRIDES above. Either way, every raw ESPN name that slot
  // actually used during THIS owner's seasons is preserved as a "↺"
  // former-name marker, so nothing gets silently relabeled.
  function buildRegistry(standings, history, ownerIndex) {
    var registry = new Map();
    var standingsById = new Map((standings && standings.teams || []).map(function (t) { return [t.teamId, t]; }));

    // Default identity for every teamId — covers any slot untouched by
    // OWNER_OVERRIDES, and any (teamId, season) an override doesn't claim.
    standingsById.forEach(function (t, teamId) {
      registry.set("team-" + teamId, { id: "team-" + teamId, name: t.name, logo: t.logo || "" });
    });

    // Explicit owner identities.
    OWNER_OVERRIDES.forEach(function (o) {
      var cur = o.activeTeamId ? standingsById.get(o.activeTeamId) : null;
      registry.set(o.id, {
        id: o.id,
        name: cur ? cur.name : o.name,
        logo: cur ? (cur.logo || "") : ""
      });
    });

    var seasonsAsc = (history.seasons || []).slice().sort(function (a, b) { return a.season - b.season; });
    var nameHistory = new Map(); // ownerId -> raw ESPN names used during that owner's seasons
    seasonsAsc.forEach(function (s) {
      (s.teams || []).forEach(function (t) {
        var ownerId = ownerIdFor(ownerIndex, t.teamId, s.season);
        if (!registry.has(ownerId)) {
          registry.set(ownerId, { id: ownerId, name: t.name, logo: "" });
        }
        var arr = nameHistory.get(ownerId) || [];
        arr.push(t.name);
        nameHistory.set(ownerId, arr);
      });
    });

    registry.forEach(function (owner) {
      var seen = new Set([owner.name]);
      var former = [];
      (nameHistory.get(owner.id) || []).forEach(function (n) {
        if (!seen.has(n)) { seen.add(n); former.push(n); }
      });
      owner.formerNames = former;
    });

    return registry;
  }

  function renamedMarkerHtml(team) {
    if (!team || !team.formerNames || !team.formerNames.length) return "";
    return ' <span class="renamed-mark" title="Also played as: ' + team.formerNames.join(", ") + '">&#8635;</span>';
  }

  function assignColors(ownerIds) {
    var sorted = ownerIds.slice().sort();
    var colorById = new Map();
    sorted.forEach(function (id, i) { colorById.set(id, PALETTE[i % PALETTE.length]); });
    return colorById;
  }

  // ---------------------------------------------------------------------
  // Line chart (Points For / Points Against)
  // ---------------------------------------------------------------------

  function buildSeriesForStat(seasons, ownerIds, registry, colorById, statKey, ownerIndex) {
    return ownerIds.map(function (ownerId) {
      var owner = registry.get(ownerId) || { name: ownerId };
      var values = [];
      var seasonNames = [];
      seasons.forEach(function (s) {
        // Which raw team (if any) did this owner hold that season? A gap here
        // (owner not active that year) correctly breaks the line on the chart.
        var row = (s.teams || []).find(function (t) { return ownerIdFor(ownerIndex, t.teamId, s.season) === ownerId; });
        values.push(row ? row[statKey] : null);
        seasonNames.push(row ? row.name : owner.name);
      });
      return { teamId: ownerId, name: owner.name, seasonNames: seasonNames, color: colorById.get(ownerId), values: values };
    });
  }

  function lineChartSvg(seasonsAsc, series, hiddenSet) {
    var W = 900, H = 400;
    var padL = 50, padR = 16, padT = 16, padB = 34;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;

    var visible = series.filter(function (s) { return !hiddenSet.has(s.teamId); });
    var allValues = [];
    (visible.length ? visible : series).forEach(function (s) {
      s.values.forEach(function (v) { if (v != null) allValues.push(v); });
    });
    if (!allValues.length) allValues = [0, 1];
    var minV = Math.min.apply(null, allValues);
    var maxV = Math.max.apply(null, allValues);
    if (minV === maxV) { minV -= 10; maxV += 10; }
    var pad = (maxV - minV) * 0.1;
    minV -= pad; maxV += pad;

    function xFor(i) { return padL + (seasonsAsc.length <= 1 ? plotW / 2 : (i / (seasonsAsc.length - 1)) * plotW); }
    function yFor(v) { return padT + plotH - ((v - minV) / (maxV - minV)) * plotH; }

    var parts = ['<svg viewBox="0 0 ' + W + ' ' + H + '" class="line-chart-svg" role="img">'];

    var ticks = 5;
    for (var i = 0; i <= ticks; i++) {
      var v = minV + (maxV - minV) * (i / ticks);
      var y = yFor(v);
      parts.push('<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" class="chart-gridline" />');
      parts.push('<text x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '" class="chart-axis-label" text-anchor="end">' + Math.round(v) + '</text>');
    }

    seasonsAsc.forEach(function (yr, i) {
      parts.push('<text x="' + xFor(i).toFixed(1) + '" y="' + (H - padB + 22) + '" class="chart-axis-label" text-anchor="middle">' + yr + '</text>');
    });

    series.forEach(function (s) {
      if (hiddenSet.has(s.teamId)) return;
      var pts = s.values.map(function (v, i) { return v == null ? null : [xFor(i), yFor(v)]; });
      var d = "";
      var drawing = false;
      pts.forEach(function (p) {
        if (!p) { drawing = false; return; }
        d += (drawing ? " L " : "M ") + p[0].toFixed(1) + " " + p[1].toFixed(1);
        drawing = true;
      });
      parts.push('<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.5" class="chart-line" />');
      pts.forEach(function (p, i) {
        if (!p) return;
        parts.push(
          '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" fill="' + s.color + '" class="chart-dot">' +
            '<title>' + (s.seasonNames ? s.seasonNames[i] : s.name) + ' — ' + seasonsAsc[i] + ': ' + fmt1(s.values[i]) + '</title>' +
          '</circle>'
        );
      });
    });

    parts.push('</svg>');
    return parts.join("");
  }

  function legendHtml(series, hiddenSet, groupId) {
    var items = series.map(function (s) {
      var isHidden = hiddenSet.has(s.teamId);
      var team = STATE.registry.get(s.teamId);
      return (
        '<div class="legend-item' + (isHidden ? ' hidden' : '') + '" data-group="' + groupId + '" data-team="' + s.teamId + '">' +
          '<span class="legend-swatch" style="background:' + s.color + '"></span>' +
          '<span>' + s.name + renamedMarkerHtml(team) + '</span>' +
        '</div>'
      );
    }).join("");
    return (
      '<div class="chart-legend-row">' +
        '<div class="legend-actions">' +
          '<button type="button" data-action="show-all" data-group="' + groupId + '">Show all</button>' +
          '<button type="button" data-action="hide-all" data-group="' + groupId + '">Hide all</button>' +
        '</div>' +
        '<div class="chart-legend">' + items + '</div>' +
      '</div>'
    );
  }

  function renderPointsChart(containerId, legendId, seasonsAsc, series, hiddenSet) {
    document.getElementById(containerId).innerHTML = lineChartSvg(seasonsAsc, series, hiddenSet);
    document.getElementById(legendId).innerHTML = legendHtml(series, hiddenSet, containerId);
  }

  function wireLegend(groupId, hiddenSet, onChange) {
    document.addEventListener("click", function (e) {
      var item = e.target.closest('.legend-item[data-group="' + groupId + '"]');
      if (item) {
        var teamId = item.getAttribute("data-team");
        if (hiddenSet.has(teamId)) hiddenSet.delete(teamId); else hiddenSet.add(teamId);
        onChange();
        return;
      }
      var btn = e.target.closest('button[data-group="' + groupId + '"]');
      if (btn) {
        var action = btn.getAttribute("data-action");
        if (action === "show-all") hiddenSet.clear();
        if (action === "hide-all") STATE.teamIds.forEach(function (id) { hiddenSet.add(id); });
        onChange();
      }
    });
  }

  // ---------------------------------------------------------------------
  // Career win/loss bars
  // ---------------------------------------------------------------------

  function careerRecords(history, registry, ownerIndex) {
    var totals = new Map();
    (history.seasons || []).forEach(function (s) {
      (s.teams || []).forEach(function (t) {
        var ownerId = ownerIdFor(ownerIndex, t.teamId, s.season);
        var rec = totals.get(ownerId) || { ownerId: ownerId, wins: 0, losses: 0, ties: 0 };
        rec.wins += t.wins;
        rec.losses += t.losses;
        rec.ties += t.ties;
        totals.set(ownerId, rec);
      });
    });
    var list = Array.from(totals.values()).map(function (r) {
      var owner = registry.get(r.ownerId) || { name: "Owner " + r.ownerId, logo: "" };
      var games = r.wins + r.losses + r.ties;
      var pct = games ? (r.wins + r.ties * 0.5) / games : 0;
      return { teamId: r.ownerId, name: owner.name, logo: owner.logo, formerNames: owner.formerNames || [], wins: r.wins, losses: r.losses, ties: r.ties, pct: pct };
    });
    list.sort(function (a, b) { return b.pct - a.pct; });
    return list;
  }

  function wlRowHtml(r) {
    var games = r.wins + r.losses + r.ties;
    var winPct = games ? (r.wins / games) * 100 : 0;
    var lossPct = games ? (r.losses / games) * 100 : 0;
    var tiePct = games ? (r.ties / games) * 100 : 0;
    var pctStr = fmtPct(r.pct);
    var recordStr = r.wins + "-" + r.losses + (r.ties ? "-" + r.ties : "") + "  (" + pctStr + ")";
    return (
      '<div class="wl-row">' +
        '<div class="team-cell">' + teamLogoHtml(r) + '<span>' + r.name + renamedMarkerHtml(r) + '</span></div>' +
        '<div class="wl-bar">' +
          '<div class="wl-seg wl-win" style="width:' + winPct.toFixed(2) + '%"></div>' +
          (tiePct ? '<div class="wl-seg wl-tie" style="width:' + tiePct.toFixed(2) + '%"></div>' : "") +
          '<div class="wl-seg wl-loss" style="width:' + lossPct.toFixed(2) + '%"></div>' +
        '</div>' +
        '<div class="wl-record">' + recordStr + '</div>' +
      '</div>'
    );
  }

  // ---------------------------------------------------------------------
  // Head to head
  // ---------------------------------------------------------------------

  function allMatchups(history) {
    var all = [];
    (history.seasons || []).forEach(function (s) {
      (s.matchups || []).forEach(function (m) {
        all.push({ season: s.season, homeTeamId: m.homeTeamId, awayTeamId: m.awayTeamId, winner: m.winner });
      });
    });
    return all;
  }

  function h2hFor(matchups, ownerId, ownerIndex) {
    var recs = new Map();
    matchups.forEach(function (m) {
      var homeOwner = ownerIdFor(ownerIndex, m.homeTeamId, m.season);
      var awayOwner = ownerIdFor(ownerIndex, m.awayTeamId, m.season);
      var isHome = homeOwner === ownerId;
      var isAway = awayOwner === ownerId;
      if (!isHome && !isAway) return;
      var oppId = isHome ? awayOwner : homeOwner;
      var rec = recs.get(oppId) || { oppId: oppId, w: 0, l: 0, t: 0 };
      if (m.winner === "TIE") {
        rec.t++;
      } else {
        var teamWon = (m.winner === "HOME" && isHome) || (m.winner === "AWAY" && isAway);
        if (teamWon) rec.w++; else rec.l++;
      }
      recs.set(oppId, rec);
    });
    return recs;
  }

  function renderH2H(ownerId) {
    var registry = STATE.registry;
    var matchups = STATE.matchups;
    var recs = h2hFor(matchups, ownerId, STATE.ownerIndex);
    var team = registry.get(ownerId) || { name: "Owner " + ownerId };

    var totalW = 0, totalL = 0, totalT = 0;
    var rows = STATE.teamIds
      .filter(function (id) { return id !== ownerId; })
      .map(function (oppId) {
        var opp = registry.get(oppId) || { name: "Owner " + oppId };
        var rec = recs.get(oppId) || { w: 0, l: 0, t: 0 };
        totalW += rec.w; totalL += rec.l; totalT += rec.t;
        var games = rec.w + rec.l + rec.t;
        var pct = games ? (rec.w + rec.t * 0.5) / games : null;
        return { opp: opp, w: rec.w, l: rec.l, t: rec.t, games: games, pct: pct };
      });

    rows.sort(function (a, b) {
      if (a.games === 0 && b.games === 0) return a.opp.name.localeCompare(b.opp.name);
      if (a.games === 0) return 1;
      if (b.games === 0) return -1;
      return b.pct - a.pct;
    });

    var summaryEl = document.getElementById("h2hSummary");
    summaryEl.innerHTML =
      team.name + renamedMarkerHtml(team) + '’s all-time record: <strong>' + totalW + '-' + totalL + (totalT ? "-" + totalT : "") + '</strong>' +
      ' across ' + (totalW + totalL + totalT) + ' games.';

    var bodyEl = document.getElementById("h2hTableBody");
    bodyEl.innerHTML = rows.map(function (r) {
      var recordStr = r.games ? (r.w + "-" + r.l + (r.t ? "-" + r.t : "")) : "—";
      var pctStr = fmtPct(r.pct);
      return (
        "<tr>" +
          "<td>" + '<div class="team-cell">' + teamLogoHtml(r.opp) + "<span>" + r.opp.name + renamedMarkerHtml(r.opp) + "</span></div>" + "</td>" +
          '<td class="num">' + recordStr + "</td>" +
          '<td class="num">' + r.games + "</td>" +
          '<td class="num">' + pctStr + "</td>" +
        "</tr>"
      );
    }).join("");
  }

  // ---------------------------------------------------------------------
  // Page assembly
  // ---------------------------------------------------------------------

  function pageHtml() {
    return (
      '<div class="section">' +
        '<div class="eyebrow">Points For, By Season</div>' +
        '<p class="lede">Total regular-season points scored, tracked year over year. Click a team in the legend to hide or show its line.</p>' +
        '<div class="panel">' +
          '<div class="chart-wrap" id="pfChart"></div>' +
          '<div id="pfLegend"></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="eyebrow">Points Against, By Season</div>' +
        '<p class="lede">Total points surrendered, tracked year over year. Lower is better.</p>' +
        '<div class="panel">' +
          '<div class="chart-wrap" id="paChart"></div>' +
          '<div id="paLegend"></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="eyebrow">Career Win-Loss</div>' +
        '<p class="lede">Total regular-season record across every synced season, ranked by win percentage.</p>' +
        '<div class="panel">' +
          '<div class="wl-list" id="wlList"></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="eyebrow">Head-to-Head</div>' +
        '<p class="lede">Pick a team to see its all-time record against every other franchise in the league.</p>' +
        '<div class="panel">' +
          '<div class="h2h-controls">' +
            '<label for="h2hTeamSelect">Team</label>' +
            '<select class="h2h-select" id="h2hTeamSelect"></select>' +
          '</div>' +
          '<div class="rename-note" id="h2hRenameNote">* has played under a different name in a past season — hover for details</div>' +
          '<div class="h2h-summary" id="h2hSummary"></div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Opponent</th><th class="num">Record</th><th class="num">Games</th><th class="num">Win Pct</th></tr></thead>' +
              '<tbody id="h2hTableBody"></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function emptyStateHtml() {
    return (
      '<div class="empty-state">' +
        '<svg class="icon" viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="14 6 21 6 21 13"/></svg>' +
        '<p>No completed past seasons have synced yet. Once a season wraps, team scoring trends, win-loss records, and head-to-head history will show up here automatically.</p>' +
      '</div>'
    );
  }

  function init(standings, history) {
    var seasons = (history.seasons || []).slice().sort(function (a, b) { return a.season - b.season; });

    if (!seasons.length) {
      document.getElementById("pageBody").innerHTML = emptyStateHtml();
      return;
    }

    var ownerIndex = buildOwnerIndex();
    var registry = buildRegistry(standings, history, ownerIndex);
    var ownerIdSet = new Set();
    seasons.forEach(function (s) {
      (s.teams || []).forEach(function (t) { ownerIdSet.add(ownerIdFor(ownerIndex, t.teamId, s.season)); });
    });
    var ownerIds = Array.from(ownerIdSet);
    var colorById = assignColors(ownerIds);
    var seasonsAsc = seasons.map(function (s) { return s.season; });

    STATE = {
      registry: registry,
      teamIds: ownerIds.sort(function (a, b) {
        var an = (registry.get(a) || {}).name || "";
        var bn = (registry.get(b) || {}).name || "";
        return an.localeCompare(bn);
      }),
      matchups: allMatchups(history),
      ownerIndex: ownerIndex
    };

    document.getElementById("pageBody").innerHTML = pageHtml();

    var pfSeries = buildSeriesForStat(seasons, ownerIds, registry, colorById, "pointsFor", ownerIndex);
    var paSeries = buildSeriesForStat(seasons, ownerIds, registry, colorById, "pointsAgainst", ownerIndex);

    function renderPF() { renderPointsChart("pfChart", "pfLegend", seasonsAsc, pfSeries, hiddenPF); }
    function renderPA() { renderPointsChart("paChart", "paLegend", seasonsAsc, paSeries, hiddenPA); }
    renderPF();
    renderPA();
    wireLegend("pfChart", hiddenPF, renderPF);
    wireLegend("paChart", hiddenPA, renderPA);

    var records = careerRecords(history, registry, ownerIndex);
    document.getElementById("wlList").innerHTML = records.map(wlRowHtml).join("");

    var select = document.getElementById("h2hTeamSelect");
    var anyRenamed = false;
    select.innerHTML = STATE.teamIds.map(function (id) {
      var t = registry.get(id) || { name: "Owner " + id };
      var former = t.formerNames && t.formerNames.length;
      if (former) anyRenamed = true;
      var titleAttr = former ? ' title="Also played as: ' + t.formerNames.join(", ") + '"' : "";
      return '<option value="' + id + '"' + titleAttr + '>' + t.name + (former ? " *" : "") + '</option>';
    }).join("");
    document.getElementById("h2hRenameNote").style.display = anyRenamed ? "" : "none";
    select.addEventListener("change", function () { renderH2H(select.value); });
    if (STATE.teamIds.length) {
      select.value = STATE.teamIds[0];
      renderH2H(STATE.teamIds[0]);
    }
  }

  Promise.all([
    fetch("data/espn-standings.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    fetch("data/espn-history.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
  ]).then(function (results) {
    var standings = results[0];
    var history = results[1] || { seasons: [] };
    init(standings, history);
  });
})();
</script>

</body>
</html>
