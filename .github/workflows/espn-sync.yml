name: Sync ESPN Fantasy Data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch ESPN data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: "1166030619"
          SEASON: "2026"
        run: node scripts/fetch-espn.mjs

      - name: Fetch ESPN league history
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: "1166030619"
          SEASON: "2026"
        run: node scripts/fetch-espn-history.mjs

      - name: Commit updated data
        run: |
          git config user.name "espn-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/espn-standings.json data/espn-scoreboard.json data/espn-history.json
          git diff --cached --quiet || git commit -m "Sync ESPN fantasy data"
          git push
