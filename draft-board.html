<style>
  :root {
    --pos-rb: #3e8f5c; --pos-rb-soft: #e4f3ea;
    --pos-wr: #b8862c; --pos-wr-soft: #f7ecd6;
    --pos-te: #3a7fb0; --pos-te-soft: #e2f0f8;
    --pos-qb: #c1483a; --pos-qb-soft: #f9e3e0;
    --pos-k: #8a4fae; --pos-k-soft: #f0e2f6;
    --pos-def: #b1621f; --pos-def-soft: #f7e6d4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pos-rb-soft: #163826; --pos-wr-soft: #3a2c10; --pos-te-soft: #12293b;
      --pos-qb-soft: #3a1a15; --pos-k-soft: #2c1938; --pos-def-soft: #33210c;
    }
  }
  :root[data-theme="dark"] {
    --pos-rb-soft: #163826; --pos-wr-soft: #3a2c10; --pos-te-soft: #12293b;
    --pos-qb-soft: #3a1a15; --pos-k-soft: #2c1938; --pos-def-soft: #33210c;
  }

  .legend-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .legend-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  .board-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  .board-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1500px; table-layout: fixed; }
  .board-table th, .board-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0; }
  .board-table th:last-child, .board-table td:last-child { border-right: none; }
  .board-table thead th {
    background: var(--surface-2);
    font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600;
    color: var(--text); text-transform: none; letter-spacing: 0;
    padding: 12px 10px; text-align: left;
    overflow-wrap: break-word; word-break: break-word;
  }
  .board-table thead th.round-col { width: 50px; text-align: center; }
  .round-cell {
    text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 12px;
    color: var(--text-faint); background: var(--surface-2); font-weight: 600;
  }
  .pick-cell { vertical-align: top; }
  .pick {
    display: flex; flex-direction: column; gap: 3px;
    padding: 9px 10px; height: 100%;
  }
  .pick .pick-meta {
    display: flex; align-items: center; gap: 5px;
    font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
  }
  .pick .pos-tag {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 1px 5px; border-radius: 4px; font-size: 9.5px; letter-spacing: 0.02em;
    flex: none;
  }
  .pick .team-abbr { color: var(--text-faint); }
  .pick .pick-name {
    font-size: 12.5px; font-weight: 600; line-height: 1.3;
    overflow-wrap: break-word; word-break: break-word;
  }

  .pick.pos-RB { background: var(--pos-rb-soft); } .pick.pos-RB .pos-tag { background: var(--pos-rb); color: #fff; }
  .pick.pos-WR { background: var(--pos-wr-soft); } .pick.pos-WR .pos-tag { background: var(--pos-wr); color: #fff; }
  .pick.pos-TE { background: var(--pos-te-soft); } .pick.pos-TE .pos-tag { background: var(--pos-te); color: #fff; }
  .pick.pos-QB { background: var(--pos-qb-soft); } .pick.pos-QB .pos-tag { background: var(--pos-qb); color: #fff; }
  .pick.pos-K { background: var(--pos-k-soft); } .pick.pos-K .pos-tag { background: var(--pos-k); color: #fff; }
  .pick.pos-DEF { background: var(--pos-def-soft); } .pick.pos-DEF .pos-tag { background: var(--pos-def); color: #fff; }
</style>
